services:
  - type: web
    name: gym-bro-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: AUTH_ACCESS_TOKEN_SECRET
        generateValue: true
      - key: AUTH_REFRESH_TOKEN_SECRET
        generateValue: true
      - key: AUTH_ACCESS_TOKEN_TTL
        value: 15m
      - key: AUTH_REFRESH_TOKEN_TTL
        value: 30d
      - key: EMAIL_CODE_PEPPER
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "Gym Bro <onboarding@resend.dev>"
      - key: CORS_ORIGIN
        value: "*"
